name: CI
on: [pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexusauto
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nexus_auto_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexusauto" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nexusauto:ci@localhost:5432/nexus_auto_test
      TEST_DATABASE_URL: postgresql+psycopg://nexusauto:ci@localhost:5432/nexus_auto_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run --passWithNoTests
      - run: npm run build